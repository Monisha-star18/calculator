<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" />
  
</head>
<body>

  <div class="calculator">

    <div class="top-bar">
      <button id="historyBtn" class="icon-btn btn" title="History"><i class="fa fa-window-restore" aria-hidden="true"></i></button>
    </div>

    <div class="display-wrap">
      <input type="text" id="display" class="display" value="" readonly>

      <div id="historyPanel" class="history-panel">
        <div class="history-header">
          <span>History</span>
        </div>
        <div id="historyItems" class="history-items">
          <div class="history-empty">No calculations yet</div>
        </div>
      </div>
    </div>

    <div class="buttons">
      <button class="btn op" data-action="clear">AC</button>
      <button class="btn op" data-value="**">x^y</button>
      <button class="btn op" data-value="%">%</button>
      <button class="btn op" data-value="/">÷</button>

      <button class="btn num" data-value="7">7</button>
      <button class="btn num" data-value="8">8</button>
      <button class="btn num" data-value="9">9</button>
      <button class="btn op" data-value="*">×</button>

      <button class="btn num" data-value="4">4</button>
      <button class="btn num" data-value="5">5</button>
      <button class="btn num" data-value="6">6</button>
      <button class="btn op" data-value="-">−</button>

      <button class="btn num" data-value="1">1</button>
      <button class="btn num" data-value="2">2</button>
      <button class="btn num" data-value="3">3</button>
      <button class="btn op" data-value="+">+</button>

      <button class="btn num" data-value="0">0</button>
      <button class="btn num" data-value=".">.</button>
      <button class="btn op" data-action="backspace">⌫</button>
      <button class="btn equals" data-action="equals">=</button>
    </div>

  </div>

<script src="./script/script.js"></script>
</body>
</html>
