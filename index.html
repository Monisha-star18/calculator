<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>

    <!-- styleesheet  -->
    <link rel="stylesheet" href="./styles/style.css">
    <!-- bootsrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- font -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
    
    <div class="container bg-secondary p-2 w-75 mt-5">

            <!-- top row icons -->
            <div class="container d-flex justify-content-between align-items-center top-icons">
                <!-- history icon -->
                <button class="btn btn-outline-light"> 
                    <i class="fa-solid fa-clock-rotate-left"></i> 
                </button>
                <!-- setting icon -->
                <button class="btn btn-outline-light"> 
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </button>
            </div>

            <!-- calculation window -->
            <div class="container bg-light p-2 mt-3 d-flex align-items-center justify-content-end calculation-window ">
                <p class="typingSpace"> </p>
                <p id="cursor">|</p>
            </div>

            <!-- click to open menu -->
            <div class="container">
                <button class="btn btn-outline-light m-2"> 
                    <i class="fa-solid fa-up-down"></i>
                </button>
            </div>

            <!-- Number palett -->
            <div class="container ml-3 justify-content-center">
                <div class="row">
                    <!-- top row  -->
                    <div class="col-3 d-flex justify-content-center mb-3">
                        <button class="num-pallet-sy-btn" id="clear">AC</button>
                    </div>
                    <div class="col-3 d-flex justify-content-center mb-3">
                        <button class="num-pallet-sy-btn" id="bracket">()</button>
                    </div>
                    <div class="col-3 d-flex justify-content-center mb-3">
                        <button class="num-pallet-sy-btn"> % </button>
                    </div>
                    <div class="col-3 d-flex justify-content-center mb-3">
                        <button class="num-pallet-sy-btn"> / </button>
                    </div>

                    <!-- 1st row -->
                    <div class="col-3 d-flex justify-content-center mb-3">
                        <button class="num-pallet-btn"> 7 </button>
                    </div>
                    <div class="col-3 d-flex justify-content-center mb-3">
                        <button class="num-pallet-btn"> 8 </button>
                    </div>
                    <div class="col-3 d-flex justify-content-center mb-3">
                        <button class="num-pallet-btn"> 9 </button>
                    </div>
                    <div class="col-3 d-flex justify-content-center mb-3">
                        <button class="num-pallet-sy-btn"> * </button>
                    </div>

                    <!-- 2nd row -->
                    <div class="col-3 d-flex justify-content-center mb-3">
                        <button class="num-pallet-btn"> 4 </button>
                    </div>
                    <div class="col-3 d-flex justify-content-center mb-3">
                        <button class="num-pallet-btn"> 5 </button>
                    </div>
                    <div class="col-3 d-flex justify-content-center mb-3">
                        <button class="num-pallet-btn"> 6 </button>
                    </div>
                    <div class="col-3 d-flex justify-content-center mb-3">
                        <button class="num-pallet-sy-btn"> - </button>
                    </div>

                    <!-- 3r row -->
                    <div class="col-3 d-flex justify-content-center mb-3">
                        <button class="num-pallet-btn"> 1 </button>
                    </div>
                    <div class="col-3 d-flex justify-content-center mb-3">
                        <button class="num-pallet-btn"> 2 </button>
                    </div>
                    <div class="col-3 d-flex justify-content-center mb-3">
                        <button class="num-pallet-btn"> 3 </button>
                    </div>
                    <div class="col-3 d-flex justify-content-center mb-3">
                        <button class="num-pallet-sy-btn"> + </button>
                    </div>

                    <!-- 4th row -->
                    <div class="col-3 d-flex justify-content-center mb-3">
                        <button class="num-pallet-btn"> 0 </button>
                    </div>
                    <div class="col-3 d-flex justify-content-center mb-3">
                        <button class="num-pallet-btn"> . </button>
                    </div>
                    <div class="col-3 d-flex justify-content-center mb-3">
                        <button class="num-pallet-btn" id="backspace"> <i class="fa-solid fa-delete-left"></i> </button>
                    </div>
                    <div class="col-3 d-flex justify-content-center mb-3">
                        <button class="num-pallet-sy-btn" id="eqaulTo"> = </button>
                    </div>

                </div>
            </div>
        
    </div>



    <!-- BOOTSRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jquery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    
    <script src="./script/script.js"></script>
    
</body>
</html>
